name: NWScript Compiler Toolchain

on:
  push:
    paths:
      - '.github/workflows/nwnsc-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch nwnsc 1.1.5
        run: |
          mkdir -p out
          curl -L --fail https://github.com/nwneetools/nwnsc/releases/download/v1.1.5/nwnsc-linux-v1.1.5.zip -o /tmp/nwnsc.zip
          unzip -q /tmp/nwnsc.zip -d /tmp/nwnsc
          NWNSC=$(find /tmp/nwnsc -type f -name nwnsc | head -1)
          test -n "$NWNSC"
          cp "$NWNSC" out/nwnsc
          chmod +x out/nwnsc
      - name: Probe Beamdog base game resources
        run: |
          docker pull beamdog/nwserver:latest
          CID=$(docker create beamdog/nwserver:latest)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker export "$CID" -o /tmp/nwserver.tar
          mkdir -p /tmp/rootfs
          tar -xf /tmp/nwserver.tar -C /tmp/rootfs
          GAME_ROOT=/tmp/rootfs/nwn/data
          echo "GAME_ROOT=$GAME_ROOT"
          find "$GAME_ROOT" -maxdepth 2 -type f \( -iname '*.key' -o -iname '*.bif' \) | head -30
          cat > /tmp/probe.nss <<'EOF'
          void main() { object o = GetPCChatSpeaker(); SetPCChatMessage(""); }
          EOF
          out/nwnsc -m 1.69 -j -n "$GAME_ROOT" /tmp/probe.nss
          test -s /tmp/probe.ncs
          sha256sum out/nwnsc > out/SHA256SUMS.txt
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: nwnsc-linux-1.1.5-probed-against-beamdog
          path: out/
          retention-days: 1
