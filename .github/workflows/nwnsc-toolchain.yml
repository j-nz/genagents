name: NWScript Compiler Toolchain

on:
  push:
    paths:
      - '.github/workflows/nwnsc-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch nwnsc 1.1.5
        run: |
          mkdir -p out/base_nss
          curl -L --fail https://github.com/nwneetools/nwnsc/releases/download/v1.1.5/nwnsc-linux-v1.1.5.zip -o /tmp/nwnsc.zip
          unzip -q /tmp/nwnsc.zip -d /tmp/nwnsc
          NWNSC=$(find /tmp/nwnsc -type f -name nwnsc | head -1)
          test -n "$NWNSC"
          cp "$NWNSC" out/nwnsc
          chmod +x out/nwnsc
      - name: Extract official NWN NSS resources from Beamdog KEY/BIF archives
        run: |
          docker pull beamdog/nwserver:latest
          CID=$(docker create beamdog/nwserver:latest)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker export "$CID" -o /tmp/nwserver.tar
          mkdir -p /tmp/rootfs
          tar -xf /tmp/nwserver.tar -C /tmp/rootfs
          python3 - <<'PY'
          import os, struct
          key_path='/tmp/rootfs/nwn/data/data/nwn_base.key'
          with open(key_path,'rb') as f: key=f.read()
          if key[:4] != b'KEY ': raise SystemExit(f'bad KEY signature {key[:8]!r}')
          bif_count,key_count,file_off,key_off=struct.unpack_from('<4I',key,8)
          files=[]
          for i in range(bif_count):
              size,name_off,name_len,drives=struct.unpack_from('<IIHH',key,file_off+i*12)
              name=key[name_off:name_off+name_len].split(b'\0',1)[0].decode('latin1').replace('\\','/')
              files.append(name)
          roots=[os.path.dirname(key_path), os.path.dirname(os.path.dirname(key_path)), '/tmp/rootfs/nwn/data', '/tmp/rootfs/nwn']
          bif_cache={}
          table_cache={}
          def bif_path(index):
              rel=files[index]
              candidates=[]
              for root in roots:
                  candidates += [os.path.join(root,rel), os.path.join(root,os.path.basename(rel))]
              p=next((p for p in candidates if os.path.exists(p)),None)
              if not p: raise FileNotFoundError(rel)
              return p
          def get_entry(resid,rtype):
              bi=(resid>>20)&0xfff; ri=resid&0xfffff
              if bi not in bif_cache:
                  p=bif_path(bi)
                  with open(p,'rb') as f: data=f.read()
                  if data[:4] != b'BIFF': raise ValueError('bad BIF '+p)
                  vc,fc,vo=struct.unpack_from('<III',data,8)
                  table={}
                  for j in range(vc):
                      rid,off,size,typ=struct.unpack_from('<IIII',data,vo+j*16)
                      table[(rid,typ)]=(off,size)
                      table[(rid&0xfffff,typ)]=(off,size)
                  bif_cache[bi]=data; table_cache[bi]=table
              table=table_cache[bi]
              ent=table.get((resid,rtype)) or table.get((ri,rtype))
              if not ent: raise KeyError((resid,rtype,bi,ri))
              off,size=ent
              return bif_cache[bi][off:off+size]
          count=0
          for i in range(key_count):
              off=key_off+i*22
              rr=key[off:off+16].split(b'\0',1)[0].decode('ascii','ignore').lower()
              rtype,resid=struct.unpack_from('<HI',key,off+16)
              if rtype != 2009 or not rr: continue
              data=get_entry(resid,rtype)
              open(os.path.join('out','base_nss',rr+'.nss'),'wb').write(data)
              count += 1
          print('Extracted NSS resources:',count)
          PY
          cp out/base_nss/nwscript.nss out/nwscript.nss
          test -s out/nwscript.nss
          grep -q 'GetPCChatSpeaker' out/nwscript.nss
          grep -q 'SetPCChatMessage' out/nwscript.nss
          test -s out/base_nss/x3_inc_string.nss
          cat > /tmp/probe.nss <<'EOF'
          #include "x3_inc_string"
          void main() { object o = GetPCChatSpeaker(); SetPCChatMessage(""); }
          EOF
          out/nwnsc -m 1.69 -i "$PWD/out/base_nss" /tmp/probe.nss
          test -s /tmp/probe.ncs
          sha256sum out/nwnsc out/nwscript.nss > out/SHA256SUMS.txt
      - name: Upload compiler and official includes
        uses: actions/upload-artifact@v4
        with:
          name: nwnsc-linux-1.1.5-with-official-nwn-includes
          path: out/
          retention-days: 1
