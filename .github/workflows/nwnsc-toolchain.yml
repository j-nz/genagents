name: NWScript Compiler Toolchain

on:
  push:
    paths:
      - '.github/workflows/nwnsc-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch nwnsc 1.1.5
        run: |
          mkdir -p out
          curl -L --fail https://github.com/nwneetools/nwnsc/releases/download/v1.1.5/nwnsc-linux-v1.1.5.zip -o /tmp/nwnsc.zip
          unzip -q /tmp/nwnsc.zip -d /tmp/nwnsc
          NWNSC=$(find /tmp/nwnsc -type f -name nwnsc | head -1)
          test -n "$NWNSC"
          cp "$NWNSC" out/nwnsc
          chmod +x out/nwnsc
      - name: Extract official nwscript.nss from Beamdog KEY/BIF archives
        run: |
          docker pull beamdog/nwserver:latest
          CID=$(docker create beamdog/nwserver:latest)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker export "$CID" -o /tmp/nwserver.tar
          mkdir -p /tmp/rootfs
          tar -xf /tmp/nwserver.tar -C /tmp/rootfs
          python3 - <<'PY'
          import os, struct
          key_path='/tmp/rootfs/nwn/data/data/nwn_base.key'
          with open(key_path,'rb') as f: key=f.read()
          if key[:4] != b'KEY ': raise SystemExit(f'bad KEY signature {key[:8]!r}')
          bif_count,key_count,file_off,key_off=struct.unpack_from('<4I',key,8)
          files=[]
          for i in range(bif_count):
              size,name_off,name_len,drives=struct.unpack_from('<IIHH',key,file_off+i*12)
              name=key[name_off:name_off+name_len].split(b'\0',1)[0].decode('latin1').replace('\\','/')
              files.append(name)
          target=None
          for i in range(key_count):
              off=key_off+i*22
              rr=key[off:off+16].split(b'\0',1)[0].decode('ascii','ignore').lower()
              rtype,resid=struct.unpack_from('<HI',key,off+16)
              if rr=='nwscript' and rtype==2009:
                  target=(resid,rtype); break
          if not target: raise SystemExit('nwscript.nss not found in KEY')
          resid,rtype=target
          bif_index=(resid>>20)&0xfff
          res_index=resid&0xfffff
          print('nwscript resid',hex(resid),'bif_index',bif_index,'res_index',res_index)
          print('bif entry',files[bif_index])
          rel=files[bif_index]
          roots=[os.path.dirname(key_path), os.path.dirname(os.path.dirname(key_path)), '/tmp/rootfs/nwn/data', '/tmp/rootfs/nwn']
          candidates=[]
          for root in roots:
              candidates += [os.path.join(root,rel), os.path.join(root,os.path.basename(rel))]
          bif_path=next((p for p in candidates if os.path.exists(p)),None)
          if not bif_path: raise SystemExit('BIF not found: '+repr(candidates))
          print('BIF',bif_path)
          with open(bif_path,'rb') as f: bif=f.read()
          if bif[:4] != b'BIFF': raise SystemExit(f'bad BIF signature {bif[:8]!r}')
          var_count,fixed_count,var_off=struct.unpack_from('<III',bif,8)
          found=None
          for i in range(var_count):
              rid,off,size,typ=struct.unpack_from('<IIII',bif,var_off+i*16)
              if (rid==resid or (rid&0xfffff)==res_index) and typ==rtype:
                  found=(off,size,rid); break
          if not found: raise SystemExit('resource entry not found in BIF')
          off,size,rid=found
          data=bif[off:off+size]
          open('out/nwscript.nss','wb').write(data)
          print('extracted',len(data),'bytes, rid',hex(rid))
          PY
          test -s out/nwscript.nss
          grep -q 'GetPCChatSpeaker' out/nwscript.nss
          grep -q 'SetPCChatMessage' out/nwscript.nss
          cat > /tmp/probe.nss <<'EOF'
          void main() { object o = GetPCChatSpeaker(); SetPCChatMessage(""); }
          EOF
          out/nwnsc -m 1.69 -i "$PWD/out" /tmp/probe.nss
          test -s /tmp/probe.ncs
          sha256sum out/nwnsc out/nwscript.nss > out/SHA256SUMS.txt
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: nwnsc-linux-1.1.5-with-official-nwscript
          path: out/
          retention-days: 1
